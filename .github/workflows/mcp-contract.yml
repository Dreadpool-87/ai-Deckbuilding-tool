name: Optional MCP protocol contract

on:
  pull_request:
    paths:
      - "integrations/mcp/**"
      - "tests/test_mcp_bridge.py"
      - "tests/test_mcp_protocol.py"
      - ".github/workflows/mcp-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install optional official MCP SDK
        run: python -m pip install --disable-pip-version-check -r integrations/mcp/requirements.txt
      - name: Verify real MCP tool listing, confirmation guard and HTTP auth gate
        run: python -m unittest discover -s tests -p "test_mcp_protocol.py" -v
