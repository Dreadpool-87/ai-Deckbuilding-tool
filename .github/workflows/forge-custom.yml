name: Forge custom 60-card AI-vs-AI smoke

on:
  workflow_dispatch:
    inputs:
      deck_a:
        description: Repository-relative .txt source for Deck A
        required: true
        type: string
        default: integrations/forge/decks/Synthetic_Green.txt
      deck_b:
        description: Repository-relative .txt source for Deck B
        required: true
        type: string
        default: examples/Synthetic_Red_B.txt
      sha_a:
        description: Confirmed SHA-256 of Deck A source bytes
        required: true
        type: string
        default: 9237626f44aa05e292642f5b4abff1d4a6836c3156a54b3d092da617c6c4b62d
      sha_b:
        description: Confirmed SHA-256 of Deck B source bytes
        required: true
        type: string
        default: 97add7b805d748bdaca17a862cd755a5fc8b6fb1a9f17a11994e67a20e345531
      seed:
        description: Explicit Forge RNG seed
        required: true
        type: string
        default: "20261014"

permissions:
  contents: read

concurrency:
  group: forge-custom-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DECK_A: ${{ inputs.deck_a }}
      DECK_B: ${{ inputs.deck_b }}
      SHA_A: ${{ inputs.sha_a }}
      SHA_B: ${{ inputs.sha_b }}
      RNG_SEED: ${{ inputs.seed }}
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare and record provenance
        shell: bash
        run: |
          set -euo pipefail
          java -version
          mkdir -p forge-custom-output
          git rev-parse HEAD | tee forge-custom-output/commit-sha.txt
          echo "FORGE_DOWNLOAD=${RUNNER_TEMP}/forge-download" >> "$GITHUB_ENV"
          echo "FORGE_EXTRACTED=${RUNNER_TEMP}/forge-extracted" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/forge-download" "${RUNNER_TEMP}/forge-extracted"
      - name: Validate and convert confirmed decklists
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/forge/scripts/convert_custom_decks.py \
            --repo "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/forge-custom-output/decks" \
            --deck-a "$DECK_A" --deck-b "$DECK_B" \
            --name-a Deck_A --name-b Deck_B \
            --sha-a "$SHA_A" --sha-b "$SHA_B"
          cat forge-custom-output/decks/deck-manifest.json
          (cd forge-custom-output/decks && sha256sum *.dck deck-manifest.json) > forge-custom-output/checksums.sha256
      - name: Restore Forge release archive cache
        id: forge-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/forge-download/forge-installer-2.0.15.tar.bz2
          key: forge-archive-ubuntu-24.04-${{ hashFiles('integrations/forge/forge-version.json') }}-v1
      - name: Download official Forge 2.0.15 archive on cache miss
        if: steps.forge-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          meta=integrations/forge/forge-version.json
          archive=$(jq -er '.archive_name' "$meta")
          url=$(jq -er '.download_url' "$meta")
          test "$archive" = "forge-installer-2.0.15.tar.bz2"
          test "$url" = "https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/$archive"
          curl --fail --location --retry 3 --retry-delay 5 \
            --connect-timeout 30 --max-time 1200 \
            --output "$FORGE_DOWNLOAD/$archive" "$url"
      - name: Verify archive bytes and extract a fresh Forge runtime
        shell: bash
        run: |
          set -euo pipefail
          meta=integrations/forge/forge-version.json
          file="$FORGE_DOWNLOAD/forge-installer-2.0.15.tar.bz2"
          sha=$(jq -er '.sha256' "$meta")
          size=$(jq -er '.size_bytes' "$meta")
          test -f "$file"
          test ! -L "$file"
          test "$(stat -c %s "$file")" = "$size"
          printf '%s  %s\n' "$sha" "$file" | sha256sum --check --strict
          tar -xjf "$file" -C "$FORGE_EXTRACTED"
          test -n "$(find "$FORGE_EXTRACTED" -type f -name '*.jar' -print -quit)"
      - name: Record pinned Forge version metadata
        shell: bash
        run: cp integrations/forge/forge-version.json forge-custom-output/forge-version.json
      - name: Run exactly one genuine Forge constructed game
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RNG_SEED" =~ ^[0-9]{1,18}$ ]] || { echo "Invalid RNG seed"; exit 2; }
          python3 integrations/forge/scripts/run_poc.py \
            --runtime "$FORGE_EXTRACTED" \
            --decks "$GITHUB_WORKSPACE/forge-custom-output/decks" \
            --output "$GITHUB_WORKSPACE/forge-custom-output" \
            --timeout 420 --clock 120 --seed "$RNG_SEED"
      - name: Honest summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Forge custom 60-card one-game smoke"
            echo "Requested A: $DECK_A"
            echo "Requested B: $DECK_B"
            if [ -f forge-custom-output/result.json ]; then
              echo '~~~json'
              cat forge-custom-output/result.json
              echo '~~~'
            else
              echo "BLOCKED: No result.json. Inspect previous steps."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve evidence, never upload Forge binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forge-custom-${{ github.run_id }}
          path: forge-custom-output/
          retention-days: 7
          if-no-files-found: warn
