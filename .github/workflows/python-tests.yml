name: MTG validator and integration regression tests

on:
  push:
    paths:
      - "validator/**"
      - "scripts/**"
      - "tools/**"
      - "tests/**"
      - "integrations/**"
      - ".github/workflows/**"
      - "README.md"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "third_party_licenses/**"
      - "docs/**"
      - "prompts/**"
      - "examples/**"
      - "rules/**"
      - "schemas/**"
      - "AGENTS.md"
      - "PROJECT_STATUS.md"
      - "PUBLIC_TESTING.md"
      - "SHA256SUMS.txt"
      - ".gitignore"
  pull_request:
    paths:
      - "validator/**"
      - "scripts/**"
      - "tools/**"
      - "tests/**"
      - "integrations/**"
      - ".github/workflows/**"
      - "README.md"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "third_party_licenses/**"
      - "docs/**"
      - "prompts/**"
      - "examples/**"
      - "rules/**"
      - "schemas/**"
      - "AGENTS.md"
      - "PROJECT_STATUS.md"
      - "PUBLIC_TESTING.md"
      - "SHA256SUMS.txt"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run complete original and newly added offline regression suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run Forge custom deck offline regression tests
        run: python -m unittest discover -s integrations/forge/tests -p "test_*.py" -v
      - name: Run isolated Commander Spellbook tests
        run: python -m unittest discover -s integrations/commander-spellbook/tests -p "test_*.py" -v

  workflow-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install CI-only YAML syntax parser
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
      - name: Parse all workflows and verify read-only upstream policy
        run: python scripts/check_workflows.py

  historical-privacy-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Scan reachable historical Git objects and commit messages
        run: python scripts/audit_public_history.py --repo . --strict
