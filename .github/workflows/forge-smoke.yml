name: Forge AI vs AI smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-ai-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout checked-in decklists
        uses: actions/checkout@v6

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Record Java and prepare directories
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "FORGE_DOWNLOAD=${RUNNER_TEMP}/forge-download" >> "$GITHUB_ENV"
          echo "FORGE_EXTRACTED=${RUNNER_TEMP}/forge-extracted" >> "$GITHUB_ENV"
          mkdir -p forge-poc-output
          mkdir -p "${RUNNER_TEMP}/forge-download" "${RUNNER_TEMP}/forge-extracted"

      - name: Convert the two synthetic example decks
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/forge/scripts/convert_decks.py \
            --repo "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/forge-poc-output/decks"
          cat forge-poc-output/decks/deck-manifest.json

      - name: Download pinned Forge directly from Card-Forge upstream
        shell: bash
        run: |
          set -euo pipefail
          meta=integrations/forge/forge-version.json
          archive=$(jq -er '.archive_name' "$meta")
          url=$(jq -er '.download_url' "$meta")
          sha=$(jq -er '.sha256' "$meta")
          size=$(jq -er '.size_bytes' "$meta")
          test "$archive" = "forge-installer-2.0.15.tar.bz2"
          test "$url" = "https://github.com/Card-Forge/forge/releases/download/forge-2.0.15/$archive"
          curl --fail --location --retry 3 --retry-delay 5 \
            --connect-timeout 30 --max-time 1200 \
            --output "$FORGE_DOWNLOAD/$archive" "$url"
          test "$(stat -c %s "$FORGE_DOWNLOAD/$archive")" = "$size"
          echo "$sha  $FORGE_DOWNLOAD/$archive" | sha256sum --check
          tar -tjf "$FORGE_DOWNLOAD/$archive" > /dev/null
          tar -xjf "$FORGE_DOWNLOAD/$archive" -C "$FORGE_EXTRACTED"
          find "$FORGE_EXTRACTED" -type f \
            \( -name "*.jar" -o -name "*.sh" \) \
            -printf '%P %s bytes\n' > forge-poc-output/installed-files.txt
          sed -n '1,100p' forge-poc-output/installed-files.txt
          cp "$meta" forge-poc-output/forge-version.json

      - name: Run ONE Forge headless AI-vs-AI game, preserve raw logs
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/forge/scripts/run_poc.py \
            --runtime "$FORGE_EXTRACTED" \
            --decks "$GITHUB_WORKSPACE/forge-poc-output/decks" \
            --output "$GITHUB_WORKSPACE/forge-poc-output" \
            --timeout 420 \
            --clock 120 \
            --seed 20261014

      - name: Write honest run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Forge AI-vs-AI: one-game smoke test"
            echo ""
            echo "Example decks: Synthetic_Red_A vs Synthetic_Red_B."
            if [ -f forge-poc-output/result.json ]; then
              echo '~~~json'
              cat forge-poc-output/result.json
              echo '~~~'
            else
              echo "NOT EXECUTED: Forge subprocess never produced a result.json."
              echo "Inspect the preceding steps for the blocking error."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve stdout stderr deck manifest and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-smoke-${{ github.run_id }}
          path: forge-poc-output/
          retention-days: 7
          if-no-files-found: warn
