name: Verify upstream MTGJSON AtomicCards (no mirror)

on:
  schedule:
    # Monthly: day 1 at 07:17 UTC (manual dispatch is also available).
    - cron: "17 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mtgjson-upstream-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Verify official MTGJSON checksum, metadata and full JSON
        run: python scripts/update_mtgjson_atomic.py --output-dir "$RUNNER_TEMP/mtgjson-verification"

      - name: Record metadata without republishing the data
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/mtgjson-verification/manifest.json"
          test -s "$manifest"
          {
            echo "## Official MTGJSON AtomicCards verification"
            echo "Version: $(jq -er '.version' "$manifest")"
            echo "SHA-256: $(jq -er '.sha256' "$manifest")"
            echo "Source: https://mtgjson.com/api/v5/AtomicCards.json.gz"
            echo "No dataset was committed, uploaded or republished."
          } >> "$GITHUB_STEP_SUMMARY"
